name: Deploy Free Food Map

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: free-food-map-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.DEPLOY_MAP_TO_CLOUDFLARE_5826_FNA106_11042026 || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Require deployment credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::error::Configure the CLOUDFLARE_API_TOKEN repository secret."
          exit 1
      - name: Apply database migrations and deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.DEPLOY_MAP_TO_CLOUDFLARE_5826_FNA106_11042026 || secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: app
          preCommands: |
            wrangler d1 migrations apply free-food-map-db --remote
            node scripts/export-public-listings.mjs --remote
          command: deploy
